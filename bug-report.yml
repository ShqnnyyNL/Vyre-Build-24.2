name: Bug report
description: Report a reproducible problem with Vyre
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a Vyre issue. Remove passwords, tokens and other secrets from logs before submitting.

  - type: input
    id: vyre
    attributes:
      label: Vyre version
      placeholder: "3.9.7.12"
    validations:
      required: true

  - type: input
    id: paper
    attributes:
      label: Exact Paper version/build
      placeholder: "Paper 26.2 build ..."
    validations:
      required: true

  - type: input
    id: java
    attributes:
      label: Java runtime
      placeholder: "java -version"
    validations:
      required: true

  - type: dropdown
    id: client
    attributes:
      label: Client
      options:
        - Java Edition
        - Bedrock / Geyser
        - Both
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Join the server
        2. Run ...
        3. Click ...
        4. Error occurs
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant sanitized console output
      render: shell

  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      options:
        - Every time
        - Often
        - Sometimes
        - Happened once
    validations:
      required: true
