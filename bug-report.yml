name: Bug report
description: Report a reproducible problem with Vyre
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Vyre. Remove credentials, private configuration, player data and proprietary binaries before submitting.
  - type: input
    id: vyre-version
    attributes:
      label: Vyre version
      placeholder: "3.9.7.15"
    validations:
      required: true
  - type: input
    id: paper-build
    attributes:
      label: Paper build
      placeholder: "26.2 build 126"
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Client platform
      options:
        - Java
        - Bedrock through Geyser/Floodgate
        - Both
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the shortest reliable path to the problem.
      placeholder: |
        1. Join the server
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, personal data, private configuration and proprietary binaries.
          required: true
