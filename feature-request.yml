name: Feature suggestion
description: Suggest an improvement to the Vyre experience
title: "[IDEA] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Focus on the player experience: enjoyment, polish, flow, performance and features that earn their place.
  - type: input
    id: title
    attributes:
      label: Idea name
      placeholder: A short memorable name
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: How should it feel in game?
      description: Describe the player flow without prescribing private implementation.
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: Realm system
      options:
        - Survival
        - Progression
        - Friends and social
        - Homes and travel
        - Quests and jobs
        - Events
        - Cosmetics
        - Economy
        - Interface and accessibility
        - Administration
        - Other
    validations:
      required: true
